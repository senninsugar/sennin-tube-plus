{% extends "base.html" %}

{% block title %}404 - ページが存在しません - 仙人Tube{% endblock %}

{% block extra_css %}
<style>
    /* --- 404 Error Page Container --- */
    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 120px);
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }

    /* YouTubeスタイルのエラーイラスト/コード */
    .error-illustration {
        position: relative;
        margin-bottom: 24px;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -2px;
        color: var(--yt-text-primary);
        opacity: 0.15;
        user-select: none;
    }

    .error-icon-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: var(--yt-chip-bg);
        border-radius: 50%;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .error-icon-wrapper .material-symbols-outlined {
        font-size: 54px;
        color: var(--yt-text-secondary);
    }

    /* メッセージテキスト */
    .error-title {
        font-size: 24px;
        font-weight: 500;
        color: var(--yt-text-primary);
        margin: 0 0 12px 0;
    }

    .error-description {
        font-size: 14px;
        color: var(--yt-text-secondary);
        max-width: 480px;
        line-height: 1.6;
        margin: 0 0 32px 0;
    }

    /* YouTube公式スタイルのピル型ボタン */
    .btn-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .yt-btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: var(--yt-text-primary);
        color: var(--yt-bg);
        padding: 0 16px;
        height: 36px;
        border-radius: 18px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: opacity 0.2s ease;
    }

    .yt-btn-primary:hover {
        opacity: 0.9;
    }

    .yt-btn-secondary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: var(--yt-chip-bg);
        color: var(--yt-text-primary);
        padding: 0 16px;
        height: 36px;
        border-radius: 18px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        border: 1px solid var(--yt-border-color);
        transition: background-color 0.2s ease;
    }

    .yt-btn-secondary:hover {
        background-color: var(--yt-hover-bg);
    }

    @media (max-width: 480px) {
        .error-code {
            font-size: 6rem;
        }
        .error-title {
            font-size: 20px;
        }
        .error-icon-wrapper {
            width: 80px;
            height: 80px;
        }
        .error-icon-wrapper .material-symbols-outlined {
            font-size: 40px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-illustration">
        <div class="error-code">404</div>
        <div class="error-icon-wrapper">
            <span class="material-symbols-outlined">search_off</span>
        </div>
    </div>

    <h1 class="error-title">このページはご利用いただけません</h1>
    
    <p class="error-description">
        大変申し訳ありません。アクセスしようとしたページは削除されたか、URLが変更された可能性があります。
    </p>

    <div class="btn-group">
        <a href="/" class="yt-btn-primary">
            <span class="material-symbols-outlined" style="font-size: 20px;">home</span>
            ホームに戻る
        </a>
        <button type="button" class="yt-btn-secondary" onclick="window.history.back();">
            <span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
            前のページに戻る
        </button>
    </div>
</div>
{% endblock %}
