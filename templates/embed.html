<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ用の viewport 設定（Safe Area 対応を追加） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YouTube Embedded Player - Glass Edition</title>

  <!-- Material Symbols Outlined の導入 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg-color: #0a0a0c;
      --glass-bg: rgba(22, 22, 29, 0.75);
      --glass-card: rgba(30, 30, 40, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.25);
      --text-color: #f1f1f5;
      --text-sub: #a0a0b0;
      --accent-color: #3ea6ff;
      --accent-glow: rgba(62, 166, 255, 0.3);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* タップ時の青い枠を消去 */
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(62, 166, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(150, 50, 255, 0.08) 0px, transparent 50%);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* スマホのアドレスバー動的変化に対応 (dvh) */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* マテリアルアイコンの基本設定 */
    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle;
      user-select: none;
    }

    /* メインレイアウト */
    .app-layout {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    /* プレイヤーセクション */
    .player-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      position: relative;
      min-height: 0;
      justify-content: center;
    }

    /* 16:9 の画面比率を美しく保つラッパー */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* サブバー (Glass UI - Safe Area対応) */
    .player-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* iPhone下部バー回避 */
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--glass-border);
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }

    .source-info-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      min-height: 40px; /* タップ範囲の確保 */
    }

    .source-info-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      font-size: 14px; /* スマホで自動ズームしない16px/14px基準 */
      outline: none;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      min-height: 42px;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* 三点リーダーボタン */
    .menu-toggle-btn {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      min-width: 44px;
    }

    .menu-toggle-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ソース選択モーダル */
    .source-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 16px;
    }

    .source-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .source-modal {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .source-modal-header {
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 12px;
    }

    .source-modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .source-option-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .source-option-card:active {
      border-color: var(--accent-color);
      background: rgba(62, 166, 255, 0.15);
    }

    .source-option-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .source-option-desc {
      font-size: 12px;
      color: var(--text-sub);
    }

    .education-subselect {
      margin-top: 6px;
      display: none;
    }

    .source-modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .source-confirm-btn {
      width: 100%;
      padding: 12px 20px;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      font-weight: 600;
      font-size: 15px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    /* オーバーレイ & ドロワー (モバイル最適化) */
    .drawer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%; /* スマホでは全幅に表示 */
      height: 100vh;
      height: 100dvh;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-left: 1px solid var(--glass-border);
      z-index: 100;
      transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .drawer.active {
      right: 0;
    }

    .drawer-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s;
    }

    .close-btn:active {
      color: #fff;
      background: rgba(255,255,255,0.15);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* iOSでの慣性スクロール有効化 */
      padding: 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* コントロールカード */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--glass-card);
      padding: 14px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    label {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: none;
      padding: 6px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .input-group {
      flex: 1;
    }

    /* Advanced Options (アコーディオン) */
    details.advanced-options {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    details.advanced-options summary {
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
      padding: 4px 0;
    }

    .advanced-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-color);
      cursor: pointer;
      padding: 4px 0;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--accent-color);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* アクションボタン */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    button.action-btn {
      flex: 1;
      padding: 12px 14px;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px var(--accent-glow);
      min-height: 44px;
    }

    button.action-btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    /* コメントエリア */
    .comments-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comments-header {
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-item {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .comment-content {
      flex: 1;
      font-size: 13px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .author-name {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .published-date {
      color: var(--text-sub);
      font-size: 11px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-pinned { background-color: rgba(255, 255, 255, 0.2); color: #fff; }
    .badge-owner { background-color: var(--accent-color); color: #000; }

    .comment-text {
      color: #ddd;
      line-height: 1.4;
      word-break: break-word;
    }

    .timestamp-link {
      color: var(--accent-color);
      cursor: pointer;
      text-decoration: underline;
      padding: 2px 4px; /* タップしやすく設定 */
      display: inline-block;
    }

    .footer-actions {
      margin-top: 6px;
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      gap: 12px;
    }

    /* タブレット・PC向けスタイル（480px以上） */
    @media (min-width: 480px) {
      .drawer {
        width: 420px; /* 画面右側に幅420pxで固定 */
      }
      .source-confirm-btn {
        width: auto;
      }
    }
  </style>
</head>
<body>

  <!-- ソース選択モーダル -->
  <div class="source-modal-overlay active" id="sourceModalOverlay">
    <div class="source-modal">
      <div class="source-modal-header">
        <span class="material-symbols-outlined">dns</span>
        再生ソースの選択
      </div>
      <div class="source-modal-body">
        <!-- Nocookie 選択肢 -->
        <div class="source-option-card" id="cardNocookie" onclick="selectSourceCategory('Nocookie')">
          <div class="source-option-title">
            <span>youtube-nocookie.com</span>
            <span class="material-symbols-outlined" id="checkNocookie">radio_button_checked</span>
          </div>
          <div class="source-option-desc">YouTube標準のプライバシー強化埋め込みプロキシ</div>
        </div>

        <!-- Education 選択肢 -->
        <div class="source-option-card" id="cardEducation" onclick="selectSourceCategory('Education')">
          <div class="source-option-title">
            <span>YouTube Education (バイパス/鍵)</span>
            <span class="material-symbols-outlined" id="checkEducation">radio_button_unchecked</span>
          </div>
          <div class="source-option-desc">制限回避・教育用ドメイン用埋め込みソース</div>
          
          <div class="education-subselect" id="eduSubSelectGroup" onclick="event.stopPropagation()">
            <select id="eduKeySelect" style="margin-top:8px;">
              <option value="Education - Toka_Kun_-1" selected>Education - Toka_Kun (Key 1)</option>
              <option value="Education - Toka_Kun_-2">Education - Toka_Kun (Key 2)</option>
              <option value="Education - Toka_Kun_-3">Education - Toka_Kun (Key 3)</option>
              <option value="Education - Toka_Kun_-4">Education - Toka_Kun (Key 4)</option>
              <option value="Education - siawaseok">Education - siawaseok3/wakame</option>
              <option value="Education - wakame">Education - wakame02/wktopu</option>
              <option value="Education - woolisbest4520-1">Education - woolisbest (1)</option>
              <option value="Education - woolisbest4520-2">Education - woolisbest (2)</option>
              <option value="Education - woolisbest4520-3">Education - woolisbest (3)</option>
              <option value="Education - woolisbest4520-4">Education - woolisbest (4)</option>
              <option value="Education - woolisbest4520-5">Education - woolisbest (5)</option>
              <option value="Education - woolisbest4520-6">Education - woolisbest (6)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="source-modal-footer">
        <button class="source-confirm-btn" onclick="confirmSourceSelection()">
          <span class="material-symbols-outlined">play_arrow</span> 決定して再生
        </button>
      </div>
    </div>
  </div>

  <div class="app-layout">
    <!-- プレイヤーエリア -->
    <div class="player-section">
      <div class="player-wrapper" id="videoContainer">
        <iframe id="videoFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <!-- サブバー (ソース変更ボタン & メニューボタン) -->
      <div class="player-subbar">
        <button class="source-info-btn" onclick="openSourceModal()">
          <span class="material-symbols-outlined">dns</span>
          ソース: <span id="currentSourceLabel" style="color:var(--accent-color); font-weight:600;">Nocookie</span>
        </button>

        <button class="menu-toggle-btn" id="btnToggleDrawer" title="設定・コメント">
          <span class="material-symbols-outlined">more_vert</span>
        </button>
      </div>
    </div>

    <!-- オーバーレイ -->
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <!-- ドロワーメニュー (設定 & コメント) -->
    <div class="drawer" id="drawer">
      <div class="drawer-header">
        <span style="display: flex; align-items: center; gap: 8px;">
          <span class="material-symbols-outlined">tune</span> 設定・コメント
        </span>
        <button class="close-btn" id="btnCloseDrawer">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="drawer-body">
        <!-- 操作コントロール -->
        <div class="controls">
          <div class="input-group">
            <label for="videoUrlInput">
              <span class="material-symbols-outlined">link</span> 動画URL / ID / リストID:
            </label>
            <div class="input-wrapper">
              <input type="text" id="videoUrlInput" placeholder="URLまたはIDを入力..." value="dQw4w9WgXcQ">
              <button class="clear-btn" id="btnClearInput">
                <span class="material-symbols-outlined">cancel</span>
              </button>
            </div>
          </div>

          <!-- 高度なオプション (Advanced Options) -->
          <details class="advanced-options">
            <summary>
              <span style="display:flex; align-items:center; gap:6px;">
                <span class="material-symbols-outlined">settings_suggest</span> 高度な再生オプション
              </span>
              <span class="material-symbols-outlined">expand_more</span>
            </summary>
            <div class="advanced-content">
              <!-- 再生位置指定 -->
              <div class="row">
                <div class="input-group">
                  <label for="startTimeInput">
                    <span class="material-symbols-outlined">play_circle</span> 開始位置:
                  </label>
                  <div class="input-wrapper">
                    <input type="text" id="startTimeInput" placeholder="例: 1:30">
                    <button class="clear-btn" id="btnClearStart">
                      <span class="material-symbols-outlined">cancel</span>
                    </button>
                  </div>
                </div>
                <div class="input-group">
                  <label for="endTimeInput">
                    <span class="material-symbols-outlined">stop_circle</span> 終了位置:
                  </label>
                  <div class="input-wrapper">
                    <input type="text" id="endTimeInput" placeholder="例: 3:00">
                    <button class="clear-btn" id="btnClearEnd">
                      <span class="material-symbols-outlined">cancel</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- フラグ設定 -->
              <div class="checkbox-grid">
                <label class="checkbox-label">
                  <input type="checkbox" id="optAutoplay" checked> 自動再生
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="optMute"> ミュート
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="optHideControls"> コントロール非表示
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" id="optRel"> 関連動画の制限
                </label>
              </div>
            </div>
          </details>

          <div class="btn-group">
            <button class="action-btn" id="btnPlay" onclick="loadVideo(false)">
              <span class="material-symbols-outlined">play_arrow</span> 再生
            </button>
            <button class="action-btn" id="btnLoop" onclick="loadVideo(true)">
              <span class="material-symbols-outlined">repeat</span> ループ
            </button>
          </div>
        </div>

        <!-- コメントエリア -->
        <div class="comments-wrapper">
          <div class="comments-header">
            <span class="material-symbols-outlined">chat</span>
            <span>コメント</span>
            <span id="commentCountBadge" style="font-size: 12px; color: var(--text-sub);"></span>
          </div>
          <div id="commentsContainer">
            <p style="text-align:center; color: var(--text-sub);">動画の読み込みを待機しています...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- ドロワー制御 ---
    const drawer = document.getElementById("drawer");
    const drawerOverlay = document.getElementById("drawerOverlay");
    const btnToggleDrawer = document.getElementById("btnToggleDrawer");
    const btnCloseDrawer = document.getElementById("btnCloseDrawer");

    function openDrawer() {
      drawer.classList.add("active");
      drawerOverlay.classList.add("active");
    }

    function closeDrawer() {
      drawer.classList.remove("active");
      drawerOverlay.classList.remove("active");
    }

    btnToggleDrawer.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);

    // --- ソース選択モーダル制御 ---
    let selectedCategory = "Nocookie";

    function openSourceModal() {
      document.getElementById("sourceModalOverlay").classList.add("active");
    }

    function selectSourceCategory(cat) {
      selectedCategory = cat;
      const checkN = document.getElementById("checkNocookie");
      const checkE = document.getElementById("checkEducation");
      const eduSub = document.getElementById("eduSubSelectGroup");

      if (cat === "Nocookie") {
        checkN.innerText = "radio_button_checked";
        checkE.innerText = "radio_button_unchecked";
        eduSub.style.display = "none";
      } else {
        checkN.innerText = "radio_button_unchecked";
        checkE.innerText = "radio_button_checked";
        eduSub.style.display = "block";
      }
    }

    function confirmSourceSelection() {
      let finalSource = "Nocookie";
      if (selectedCategory === "Education") {
        finalSource = document.getElementById("eduKeySelect").value;
      }
      
      localStorage.setItem("preferredSource", finalSource);
      document.getElementById("currentSourceLabel").innerText = selectedCategory === "Nocookie" ? "Nocookie" : "Education";
      document.getElementById("sourceModalOverlay").classList.remove("active");

      // ソースが選択されたら自動的に動画を読み込んで再生
      loadVideo(false);
    }

    // --- YouTube API ---
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player = null;
    var currentLoadedVideoId = null;

    // --- 入力制御 & クリアボタン ---
    const inputGroups = [
      { inputId: "videoUrlInput", btnId: "btnClearInput" },
      { inputId: "startTimeInput", btnId: "btnClearStart" },
      { inputId: "endTimeInput", btnId: "btnClearEnd" }
    ];

    function setupInputControl(group) {
      const input = document.getElementById(group.inputId);
      const btn = document.getElementById(group.btnId);
      if (!input || !btn) return;

      const toggleBtn = () => {
        btn.style.display = input.value.length > 0 ? "block" : "none";
      };

      input.addEventListener("input", toggleBtn);

      btn.addEventListener("click", function() {
        input.value = "";
        input.focus();
        toggleBtn();
      });

      input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          event.preventDefault();
          loadVideo(false);
          closeDrawer();
        }
      });

      input.checkClearButton = toggleBtn;
    }

    inputGroups.forEach(setupInputControl);

    // タイムコード自動判定
    document.getElementById("videoUrlInput").addEventListener("input", function() {
      const val = this.value;
      const startInput = document.getElementById("startTimeInput");
      const endInput = document.getElementById("endTimeInput");

      const startMatch = val.match(/[?&](?:amp;)?(?:t|start)=([^&]+)/);
      if (startMatch) {
        let t = startMatch[1];
        if (t.endsWith('s') && !t.includes('m') && !t.includes('h')) t = t.slice(0, -1);
        startInput.value = t;
      } else {
        startInput.value = "";
      }
      if (startInput.checkClearButton) startInput.checkClearButton();

      const endMatch = val.match(/[?&](?:amp;)?end=([^&]+)/);
      if (endMatch) {
        let t = endMatch[1];
        if (t.endsWith('s') && !t.includes('m') && !t.includes('h')) t = t.slice(0, -1);
        endInput.value = t;
      } else {
        endInput.value = "";
      }
      if (endInput.checkClearButton) endInput.checkClearButton();
    });

    function checkAllInputs() {
      inputGroups.forEach(group => {
        const input = document.getElementById(group.inputId);
        if (input && input.checkClearButton) input.checkClearButton();
      });
    }

    window.addEventListener('pageshow', checkAllInputs);
    document.addEventListener('DOMContentLoaded', checkAllInputs);

    // --- ソース定義 ---
    const URLS = {
      "Nocookie": null,
      "Education - wakame": "https://raw.githubusercontent.com/wakame02/wktopu/refs/heads/main/edu.text",
      "Education - siawaseok": "https://raw.githubusercontent.com/siawaseok3/wakame/master/video_config.json",
      "Education - Toka_Kun_-1": "https://raw.githubusercontent.com/toka-kun/Education/refs/heads/main/keys/key1.json",
      "Education - Toka_Kun_-2": "https://raw.githubusercontent.com/toka-kun/Education/refs/heads/main/keys/key2.json",
      "Education - Toka_Kun_-3": "https://raw.githubusercontent.com/toka-kun/Education/refs/heads/main/keys/key3.json",
      "Education - Toka_Kun_-4": "https://raw.githubusercontent.com/toka-kun/Education/refs/heads/main/keys/key4.json",
      "Education - woolisbest4520-1": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/1.txt",
      "Education - woolisbest4520-2": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/2.txt",
      "Education - woolisbest4520-3": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/3.txt",
      "Education - woolisbest4520-4": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/4.txt",
      "Education - woolisbest4520-5": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/5.txt",
      "Education - woolisbest4520-6": "https://raw.githubusercontent.com/wista-api-project/auto/refs/heads/main/edu/6.txt"
    };

    function extractVideoId(input) {
      if (!input) return null;
      const patterns = [
        /[?&]v=([\w-]{11})/,
        /(?:youtu\.be|embed|shorts|live|vi|videos|watch|w|s|v|video|stream|streams|m3u8|nocookie|edu|education|umekomi|stream_360p_url|stream_high)\/([\w-]{11})/
      ];
      for (const p of patterns) {
        const m = input.match(p);
        if (m) return m[1];
      }
      if (/^[\w-]{11}$/.test(input)) return input;
      return null;
    }

    function extractListId(input) {
      if (!input) return null;
      let listId = null;

      const m = input.match(/(?:[?&](?:list|playlist)=|\/(?:channel|wkt\/c)\/)([a-zA-Z0-9_-]+)/);
      if (m) {
        listId = m[1];
      } else if (/^(?:PL|RD|LL|UU|FL|UC|OLAK5uy_)[a-zA-Z0-9_-]+$/.test(input) && input.length !== 11) {
        listId = input;
      }

      if (listId) {
        return listId.startsWith('UC') ? 'UU' + listId.substring(2) : listId;
      }
      return null;
    }

    function convertToSeconds(input) {
      if (!input) return null;
      const str = input.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/：/g, ':').trim();
      if (!str) return null;
      if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        if (parts.some(isNaN)) return null;
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
        if (parts.length === 2) return parts[0] * 60 + parts[1];
      }
      const val = parseInt(str, 10);
      return isNaN(val) ? null : val;
    }

    function updateUrlParam(url, key, value) {
      const regex = new RegExp(`([?&])(?:amp;)?${key}=[^&]*`, 'gi');
      if (regex.test(url)) {
         return url.replace(regex, (match, separator) => `${separator}${key}=${value}`);
      }
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}${key}=${value}`;
    }

    function sanitizeHTML(html) {
      const div = document.createElement('div');
      div.innerHTML = html;
      const dangerousTags = ['script', 'iframe', 'object', 'embed', 'form', 'style', 'meta', 'link'];
      dangerousTags.forEach(tag => {
        const elements = div.querySelectorAll(tag);
        elements.forEach(el => el.remove());
      });
      const allElements = div.querySelectorAll('*');
      allElements.forEach(el => {
        Array.from(el.attributes).forEach(attr => {
          if (attr.name.startsWith('on') || (attr.value && attr.value.toLowerCase().includes('javascript:'))) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return div.innerHTML;
    }

    function parseTimestamp(text) {
      const regex = /\b(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\b/g;
      return text.replace(regex, (match, h, m, s) => {
        let seconds = 0;
        if (h) seconds += parseInt(h) * 3600;
        seconds += parseInt(m) * 60;
        seconds += parseInt(s);
        return `<a class="timestamp-link" onclick="seekVideo(${seconds}); return false;">${match}</a>`;
      });
    }

    function seekVideo(seconds) {
      if (player && typeof player.seekTo === 'function') {
          player.seekTo(seconds, true);
          closeDrawer();
          return;
      }
      const frame = document.getElementById("videoFrame");
      if (!frame) return;
      
      let src = frame.src;
      if (!src || src === "about:blank") return;
      const newSrc = updateUrlParam(src, 'start', seconds);
      if (src !== newSrc) frame.src = newSrc;
      closeDrawer();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.UNSTARTED || event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
          if (event.target) {
              let newVideoId = null;
              if (typeof event.target.getVideoUrl === 'function') {
                  newVideoId = extractVideoId(event.target.getVideoUrl());
              }
              if (!newVideoId && typeof event.target.getVideoData === 'function') {
                  const data = event.target.getVideoData();
                  if (data && data.video_id) newVideoId = data.video_id;
              }

              if (newVideoId && currentLoadedVideoId !== newVideoId) {
                  currentLoadedVideoId = newVideoId;
                  fetchComments(currentLoadedVideoId);
                  
                  try {
                    const hashParams = new URLSearchParams(window.location.hash.replace(/^#\??/, ''));
                    if (!hashParams.has('v') || hashParams.get('v') !== newVideoId) {
                        hashParams.set('v', newVideoId);
                        history.replaceState(null, '', "#?" + hashParams.toString());
                    }
                  } catch (e) {
                    console.error("URL update failed", e);
                  }
              }
          }
      }
    }

    function initYouTubePlayer() {
      if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') return; 
      try {
          player = new YT.Player('videoFrame', {
              events: { 'onStateChange': onPlayerStateChange }
          });
      } catch (e) {
          console.error("YouTube API初期化失敗", e);
      }
    }

    let cachedApiUrls = null;
    const fallbackApiUrls = [
      "https://min-tube2-api.vercel.app",
      "https://min-tube-api-3.vercel.app",
      "https://min-tube-api4.vercel.app",
      "https://server-minp.vercel.app",
      "https://min-tube-api5.vercel.app"
    ];

    async function fetchComments(videoId) {
      const container = document.getElementById("commentsContainer");
      const countBadge = document.getElementById("commentCountBadge");
      
      container.innerHTML = '<p style="text-align:center;">読み込み中...</p>';
      countBadge.innerText = '';

      try {
        if (!cachedApiUrls) {
          try {
            const listRes = await fetch("https://raw.githubusercontent.com/Minotaur-ZAOU/test/refs/heads/main/min-tube-api.json");
            if (!listRes.ok) throw new Error("APIリスト読み込み失敗");
            cachedApiUrls = await listRes.json();
          } catch (err) {
            cachedApiUrls = fallbackApiUrls;
          }
        }

        let data = null;
        let isSuccess = false;

        for (const baseUrl of cachedApiUrls) {
          try {
            const apiUrl = `${baseUrl.replace(/\/$/, '')}/api/comments/${videoId}`;
            const res = await fetch(apiUrl);
            if (res.ok) {
              data = await res.json();
              isSuccess = true;
              break;
            }
          } catch (err) {}
        }

        if (!isSuccess || !data) throw new Error("すべてのAPIサーバーでコメント取得失敗");

        if (!data.comments || data.comments.length === 0) {
          container.innerHTML = '<p style="text-align:center;">コメントが見つかりませんでした。</p>';
          return;
        }

        countBadge.innerText = `(${data.commentCount || data.comments.length})`;
        
        let html = '';
        data.comments.forEach(c => {
          let badges = '';
          if (c.isPinned) badges += `<span class="badge badge-pinned">固定</span>`;
          if (c.authorIsChannelOwner) badges += `<span class="badge badge-owner">主</span>`;

          let editedHtml = c.isEdited ? `<span style="font-size:10px; color:var(--text-sub);">(編集済み)</span>` : '';
          let replyCountHtml = (c.replies && c.replies.replyCount > 0) ? `<span style="margin-left: 8px;">💬 ${c.replies.replyCount}</span>` : '';

          let safeHtml = sanitizeHTML(c.contentHtml);
          safeHtml = safeHtml.replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ');
          const processedContent = parseTimestamp(safeHtml);

          html += `
            <div class="comment-item">
              <div class="comment-content">
                <div class="comment-header">
                  <a href="https://www.youtube.com${c.authorUrl}" target="_blank" class="author-name">${c.author}</a>
                  ${badges}
                  <span class="published-date">${c.publishedText}</span>
                  ${editedHtml}
                </div>
                <div class="comment-text">${processedContent}</div>
                <div class="footer-actions">
                  <span>👍 ${c.likeCount}</span>
                  ${replyCountHtml}
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<p style="text-align:center; color:#f55;">コメントの取得に失敗しました。</p>';
      }
    }

    function resetButtons() {
      document.getElementById("btnPlay").innerHTML = '<span class="material-symbols-outlined">play_arrow</span> 再生';
      document.getElementById("btnLoop").innerHTML = '<span class="material-symbols-outlined">repeat</span> ループ';
    }

    async function loadVideo(isLoop = false) {
      const btnPlay = document.getElementById("btnPlay");
      const btnLoop = document.getElementById("btnLoop");

      const input = document.getElementById("videoUrlInput").value.trim();
      if (!input) {
        alert("URLまたは動画IDを入力してください。");
        return;
      }

      resetButtons();
      if (isLoop) btnLoop.innerHTML = '<span class="material-symbols-outlined">sync</span> 再生中...';
      else btnPlay.innerHTML = '<span class="material-symbols-outlined">sync</span> 再生中...';

      if (player) {
        try { player.destroy(); } catch(e) {}
        player = null;
      }

      const container = document.getElementById("videoContainer");
      container.innerHTML = '';
      
      const source = localStorage.getItem("preferredSource") || "Nocookie";
      const videoId = extractVideoId(input);
      const listId = extractListId(input);

      if (!videoId && !listId) {
        alert("正しいURL、動画ID、または再生リストIDを入力してください。");
        resetButtons();
        return;
      }

      if (videoId) {
        if (currentLoadedVideoId !== videoId) {
            currentLoadedVideoId = videoId;
            fetchComments(videoId);
        }
      } else {
        currentLoadedVideoId = null;
        document.getElementById("commentsContainer").innerHTML = '<p style="text-align:center; color:var(--text-sub);">動画の読み込みを待機しています...</p>';
        document.getElementById("commentCountBadge").innerText = '';
      }

      const newIframe = document.createElement("iframe");
      newIframe.id = "videoFrame";
      newIframe.allowFullscreen = true;
      newIframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      newIframe.referrerPolicy = "strict-origin-when-cross-origin";
      
      container.appendChild(newIframe);

      const startInput = document.getElementById("startTimeInput").value;
      const endInput = document.getElementById("endTimeInput").value;
      const startSeconds = convertToSeconds(startInput);
      const endSeconds = convertToSeconds(endInput);

      const embedId = videoId || 'videoseries';
      let finalUrl = "";

      try {
          if (source === "Nocookie") {
            finalUrl = `https://www.youtube-nocookie.com/embed/${embedId}`;
          } else {
              const r = await fetch(URLS[source], { cache: "no-store" });
              if (!r.ok) throw new Error("取得失敗");

              let params = "";
              if (source === "Education - wakame" || source.startsWith("Education - woolisbest")) {
                params = await r.text();
              } else if (source === "Education - siawaseok") {
                params = (await r.json()).params || "";
              } else if (source.startsWith("Education - Toka_Kun")) {
                params = (await r.json()).result || "";
              }
              
              finalUrl = `https://www.youtubeeducation.com/embed/${embedId}${params}`;
          }
      } catch (e) {
          console.error(e);
          alert("設定の取得に失敗しました。");
          resetButtons();
          return;
      }

      // --- 高度な再生オプション パラメータ組み込み ---
      const optAutoplay = document.getElementById("optAutoplay").checked;
      const optMute = document.getElementById("optMute").checked;
      const optHideControls = document.getElementById("optHideControls").checked;
      const optRel = document.getElementById("optRel").checked;

      finalUrl = updateUrlParam(finalUrl, 'autoplay', optAutoplay ? '1' : '0');
      finalUrl = updateUrlParam(finalUrl, 'mute', optMute ? '1' : '0');
      if (optHideControls) finalUrl = updateUrlParam(finalUrl, 'controls', '0');
      if (optRel) finalUrl = updateUrlParam(finalUrl, 'rel', '0');

      if (listId) {
        if (listId === videoId) {
          finalUrl = updateUrlParam(finalUrl, 'playlist', listId);
        } else {
          finalUrl = updateUrlParam(finalUrl, 'list', listId);
        }
      } else if (videoId) {
        finalUrl = updateUrlParam(finalUrl, 'playlist', videoId);
      }

      if (isLoop) finalUrl = updateUrlParam(finalUrl, 'loop', '1');
      if (startSeconds !== null) finalUrl = updateUrlParam(finalUrl, 'start', startSeconds);
      if (endSeconds !== null) finalUrl = updateUrlParam(finalUrl, 'end', endSeconds);

      finalUrl = updateUrlParam(finalUrl, 'enablejsapi', '1');
      finalUrl = updateUrlParam(finalUrl, 'origin', window.location.origin);

      newIframe.onload = function() {
          initYouTubePlayer();
      };
      
      newIframe.src = finalUrl;

      try {
        const hashParams = new URLSearchParams();
        if (videoId) hashParams.set('v', videoId);

        if (listId && listId !== videoId) {
          hashParams.set('list', listId);
        } else if (videoId) {
          hashParams.set('playlist', videoId);
        }

        if (startInput) hashParams.set('start', startInput);
        if (endInput) hashParams.set('end', endInput);

        history.replaceState(null, '', "#?" + hashParams.toString());
      } catch (e) {
        console.error("URL update failed", e);
      }
    }

    function restoreStateFromUrl() {
      let targetVid = null;

      // パス形式 `/embed/VIDEO_ID` からの判定
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      if (pathSegments.length >= 2 && pathSegments[0] === 'embed') {
        targetVid = pathSegments[1];
      }

      const hash = window.location.hash;
      if (hash && hash.length >= 2) {
        const queryString = hash.replace(/^#\??/, '');
        const params = new URLSearchParams(queryString);

        const v = params.get('v');
        const list = params.get('list');
        const start = params.get('start');
        const end = params.get('end');

        if (v) targetVid = v;

        if (targetVid) {
          let urlValue = `https://www.youtube.com/watch?v=${targetVid}`;
          if (list) urlValue = `https://www.youtube.com/watch?v=${targetVid}&list=${list}`;
          const urlInput = document.getElementById("videoUrlInput");
          urlInput.value = urlValue;
          urlInput.dispatchEvent(new Event('input'));
        } else if (list) {
          const urlInput = document.getElementById("videoUrlInput");
          urlInput.value = `https://www.youtube.com/playlist?list=${list}`;
          urlInput.dispatchEvent(new Event('input'));
        }

        if (start) {
          const sInput = document.getElementById("startTimeInput");
          sInput.value = start;
          sInput.dispatchEvent(new Event('input'));
        }

        if (end) {
          const eInput = document.getElementById("endTimeInput");
          eInput.value = end;
          eInput.dispatchEvent(new Event('input'));
        }
      } else if (targetVid) {
        const urlInput = document.getElementById("videoUrlInput");
        urlInput.value = targetVid;
        urlInput.dispatchEvent(new Event('input'));
      }

      // 自動初期再生を実行
      if (document.getElementById("videoUrlInput").value) {
        loadVideo(false);
      }
    }

    window.addEventListener('DOMContentLoaded', restoreStateFromUrl);
  </script>
</body>
